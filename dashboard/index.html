
<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kigali Eats | Dashboard</title>
</head>
<body class="min-h-screen bg-slate-50 text-slate-800">
  <header class="bg-green-800 px-6 py-6 text-white">
    <div class="mx-auto max-w-7xl">
      <p class="text-sm text-green-100">KIGALI EATS</p>
      <h1 class="mt-1 text-2xl font-bold">Orders Dashboard</h1>
      <p class="mt-1 text-sm text-green-100">Restaurant performance overview</p>
    </div>
  </header>
  <main class="mx-auto max-w-7xl space-y-8 p-5 md:p-8">
    <section id="stats" class="grid grid-cols-1 gap-4 sm:grid-cols-2 xl:grid-cols-4"></section>
    <section class="rounded-xl border border-slate-200 bg-white p-5 shadow-sm">
      <h2 class="mb-5 text-lg font-bold">Revenue by District</h2>
      <div id="districtChart" class="space-y-5"></div>
    </section>
    <section class="rounded-xl border border-slate-200 bg-white p-5 shadow-sm">
      <div class="mb-5 flex flex-wrap items-center justify-between gap-3">
        <h2 class="text-lg font-bold">Customer Orders</h2>
        <div id="filters" class="flex flex-wrap gap-2">
          <button data-filter="all" class="rounded-lg bg-green-800 px-3 py-2 text-sm font-medium text-white">All</button>
          <button data-filter="delivered" class="rounded-lg bg-slate-100 px-3 py-2 text-sm font-medium">Delivered</button>
          <button data-filter="pending" class="rounded-lg bg-slate-100 px-3 py-2 text-sm font-medium">Pending</button>
          <button data-filter="cancelled" class="rounded-lg bg-slate-100 px-3 py-2 text-sm font-medium">Cancelled</button>
        </div>
      </div>
      <p id="tableCount" class="mb-3 text-sm text-slate-500"></p>
      <div class="overflow-x-auto">
        <table class="w-full min-w-[650px] text-left text-sm">
          <thead class="bg-slate-50 text-slate-600">
            <tr>
              <th class="p-3">Order ID</th>
              <th class="p-3">Customer</th>
              <th class="p-3">District</th>
              <th class="p-3">Total (RWF)</th>
              <th class="p-3">Status</th>
            </tr>
          </thead>
          <tbody id="ordersTable" class="divide-y divide-slate-100"></tbody>
        </table>
      </div>
    </section>
  </main>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
